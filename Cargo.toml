[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/helper",
    "crates/cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["imInph <inph@inphner.com>"]
repository = "https://github.com/imInph/inphiso-gui"
rust-version = "1.80"

[workspace.dependencies]
inphiso-core = { path = "crates/core" }
inphiso-platform = { path = "crates/platform" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
