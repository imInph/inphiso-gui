[package]
name = "inphiso-core"
description = "Image detection, decompression and write pipelines for inphiso"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
liblzma = { version = "0.4", default-features = false, features = ["static"] }
flate2 = "1"
bzip2 = "0.6"
zstd = { version = "0.14", default-features = false }
crc32fast = "1.5"
fatfs = "0.3.6"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
