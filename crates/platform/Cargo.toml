[package]
name = "inphiso-platform"
description = "Per-OS drive listing, unmounting, raw device access and elevation for inphiso"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The diskutil parser is plain code, compiled everywhere so it can be unit-tested on any OS.
plist = "1.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
]
